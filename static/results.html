<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flight details</title><style>body{margin:0;font:16px system-ui;background:#071629;color:#edf7ff}.shell{max-width:800px;margin:8vh auto;padding:25px}a{color:#63d9ff}.card{background:#102741;border-radius:18px;padding:28px;margin-top:25px}.route{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center}.right{text-align:right}.code{font-size:2.4rem;font-weight:800}.muted{color:#acc0d3}.pill{display:inline-block;padding:6px 11px;background:#174969;border-radius:99px;color:#8ce8ff}.risk{font-size:2.1rem;font-weight:800;color:#ffd386}.error{color:#ffb4b4}#loading{color:#8ce8ff}</style></head>
<body><main class="shell"><a href="/">← New search</a><div id="loading">Getting live flight details…</div><section class="card" id="card" hidden></section></main><script>const q=new URLSearchParams(location.search);const safe=x=>x||'Not available';async function run(){try{let r=await fetch('/api/flight',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({flight_number:q.get('flight'),departure_date:q.get('date')})});let d=await r.json();if(!r.ok)throw Error(d.detail||'Search failed');loading.hidden=true;card.hidden=false;card.innerHTML=`<span class="pill">${safe(d.status)}</span><h1>${safe(d.flight)} <small class="muted">${safe(d.airline)}</small></h1><div class="route"><div><div class="code">${safe(d.departure.airport)}</div><div>${safe(d.departure.time)}</div><div class="muted">Terminal: ${safe(d.departure.terminal)}</div></div><div>✈</div><div class="right"><div class="code">${safe(d.arrival.airport)}</div><div>${safe(d.arrival.time)}</div><div class="muted">Terminal: ${safe(d.arrival.terminal)}</div></div></div><hr><p>Aircraft: <b>${safe(d.aircraft)}</b></p><p class="muted">ML delay risk</p><div class="risk">${d.delay_risk_percent}%</div><p class="muted">${d.data_note}</p>`}catch(e){loading.className='error';loading.textContent=e.message}}run()</script></body></html>
