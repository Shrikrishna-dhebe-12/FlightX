<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flight Finder</title>
<style>body{margin:0;font:16px system-ui;background:#071629;color:#ecf6ff}.shell{max-width:680px;margin:11vh auto;padding:32px}.tag{color:#60d7ff;text-transform:uppercase;letter-spacing:.15em;font-size:.75rem}h1{font-size:clamp(2.2rem,8vw,4.7rem);margin:.2em 0}p{color:#aac0d4;line-height:1.6}form{display:grid;gap:16px;background:#102741;padding:24px;border-radius:18px;margin-top:32px}label{display:grid;gap:7px;color:#dcecff}input,button{border-radius:10px;padding:14px;font:inherit;border:1px solid #315372}input{background:#091b2e;color:white}button{background:#61d9ff;color:#062036;font-weight:750;border:0;cursor:pointer}.hint{font-size:.85rem}</style></head>
<body><main class="shell"><span class="tag">Live flight search</span><h1>Find your flight.</h1><p>Enter a flight number and its departure date for the latest schedule details and a small ML-based delay-risk estimate.</p><form id="search"><label>Flight number<input id="flight" placeholder="AI101 or 6E234" required pattern="[A-Za-z0-9 ]+"></label><label>Departure date<input id="date" type="date" required></label><button>Search flight →</button><span class="hint">Live data needs Amadeus API credentials configured on the server.</span></form></main><script>document.querySelector('#date').value=new Date().toISOString().slice(0,10);document.querySelector('#search').onsubmit=e=>{e.preventDefault();location.href='/results?flight='+encodeURIComponent(flight.value)+'&date='+date.value}</script></body></html>
